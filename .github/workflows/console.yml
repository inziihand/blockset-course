name: Console checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:firestore-rules
      - run: npm test
      - run: npm run build
      - run: npm exec --workspace=@stratexec/console -- playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-browser-failures
          path: |
            apps/console/playwright-report
            apps/console/test-results
          retention-days: 7
