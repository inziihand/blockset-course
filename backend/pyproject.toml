[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stratexec-platform-backend"
version = "0.1.0"
description = "Platform-owned HTTP APIs for the StratExec mother template"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.110.2",
  "firebase-admin==7.5.0",
  "pydantic==2.13.5",
  "truststore==0.10.4",
  "uvicorn==0.29.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
